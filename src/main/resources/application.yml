spring:
  application:
    name: crawler
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migrations

logging:
  level:
    com:
      fakecompany:
        crawler: DEBUG

async:
  config:
    jobExecutor:
      corePoolSize: 2
      maxPoolSize: 2
      queueCapacity: 500
      threadName: 'CrawlerJobAsync'
    pageExecutor:
      corePoolSize: 8
      maxPoolSize: 8
      queueCapacity: 500
      threadName: 'CrawlerPageAsync'